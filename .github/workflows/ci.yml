name: CI

# 게이트 검증 파이프라인 (src/AGENTS.md §5 기준)
# - dev 대상 PR : 무결성 + 단위 테스트 (빠른 피드백)
# - main 대상 PR: 위 항목 + 전체 회귀 (릴리스 게이트)
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: 문서·스크립트 무결성 (check_docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 계약 동결 검증에 동결 태그가 필요하므로 전체 히스토리를 가져온다.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 게이트 스크립트 자체의 문법 오류를 먼저 잡는다.
      # (AGENTS_REVIEW_02 P0-1: 인라인 one-liner가 SyntaxError로 깨진 사례 재발 방지)
      - name: 검증 스크립트 문법 검사 (py_compile)
        run: |
          python -m py_compile check_docs.py
          find scripts -name '*.py' -print0 2>/dev/null | xargs -0 -r python -m py_compile
          echo "OK: 모든 검증 스크립트 컴파일 통과"

      - name: 문서 무결성 검사 (제어문자 / 표 정합성)
        run: python check_docs.py

      # 문서에 적힌 게이트 명령어 자체가 실행 가능한지 검증한다.
      # (AGENTS_REVIEW_02 P0-1: Gate 1 인라인 명령어가 SyntaxError로 깨져
      #  게이트를 영구히 통과할 수 없던 사례 재발 방지)
      - name: 게이트 명령어 구문 검증
        run: python scripts/check_gate_commands.py

      # Gate 0 승인 이후 src/contracts/** 는 읽기 전용이다 (AGENTS.md §3-2).
      # 동결 태그 대비 변경이 있으면 실패시켜 무단 계약 수정을 차단한다.
      - name: 계약 동결 검증
        run: python scripts/check_contracts_freeze.py

      # 판정형 하네스가 커버리지 자기검증을 갖췄는지 확인한다.
      # (AGENTS.md §5 규칙 1 — 미측정 경로가 게이트를 통과하던 사고 재발 방지)
      - name: 하네스 커버리지 자기검증
        run: python scripts/check_harness_coverage.py

  unit-tests:
    name: 단위 테스트 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: 의존성 동기화 (dev extras 포함)
        run: |
          uv sync --extra dev
          uv pip install -e .

      # 실브라우저 테스트가 CI에서 조용히 skip되면 Gate를 독립 검증할 수 없다.
      - name: Chromium 설치
        run: uv run playwright install --with-deps chromium

      - name: pytest 실행
        run: |
          set +e
          uv run pytest tests -q
          code=$?
          # exit 5 = 수집된 테스트 없음. Stage 0 착수 전에는 정상 상태로 간주한다.
          if [ $code -eq 5 ]; then
            echo "::notice::수집된 테스트가 없습니다 (Stage 0 착수 전 정상)."
            exit 0
          fi
          exit $code

  release-gate:
    name: 릴리스 게이트 (main 대상 PR 전용)
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [integrity, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: 의존성 동기화
        run: |
          uv sync --extra dev
          uv pip install -e .

      - name: Chromium 설치
        run: uv run playwright install --with-deps chromium

      # Stage 진행에 따라 아래 게이트를 순차적으로 활성화한다.
      # (src/AGENTS.md §5의 Gate 0 ~ Gate 3-B 명령어와 1:1 대응)
      - name: Gate 0 — 계약 동결 검증
        run: |
          if [ -d src/contracts ]; then
            uv run python -c "import contracts; assert len([m for m in dir(contracts) if m.endswith('Input')]) == 19"
            uv run python -c "from contracts import ErrorCode; assert len(ErrorCode) >= 20"
            uv run pytest tests/contracts -q
          else
            echo "::notice::src/contracts 미존재 — Stage 0 착수 전이므로 건너뜁니다."
          fi

      - name: Gate 1 — 하네스 자체 검증
        run: |
          if [ -d src/harness ]; then
            uv run python -m harness.contract_selftest
            uv run python -m harness.selfcheck --mock-sites 22
            uv run python -m harness.recall --golden
          else
            echo "::notice::src/harness 미존재 — Stage 1 착수 전이므로 건너뜁니다."
          fi

      - name: Gate 2 — 인지 엔진 실측
        run: |
          if [ -d src/perception ]; then
            uv run python -m harness.recall --pages 100 --top-n 20
          else
            echo "::notice::src/perception 미존재 — Stage 2 착수 전이므로 건너뜁니다."
          fi

      - name: Gate 3-B — MVP v1.0 릴리스 게이트
        run: |
          if [ -d src/interface ]; then
            uv run python -m harness.mcp_smoke
            uv run python -m harness.flaky_test --runs 5
            uv run python -m harness.latency_test --steps 100
            uv run python -m harness.webarena --tasks 20
            uv run python -m harness.ipi_test
            uv run python -m harness.session_probe --runs 50
          else
            echo "::notice::src/interface 미존재 — Stage 3-B 착수 전이므로 건너뜁니다."
          fi

      - name: 전체 회귀 테스트
        run: |
          set +e
          uv run pytest tests -q
          code=$?
          if [ $code -eq 5 ]; then
            echo "::notice::수집된 테스트가 없습니다 (Stage 0 착수 전 정상)."
            exit 0
          fi
          exit $code

      # 설치 안내가 실제와 일치하는지 검증한다.
      # 문서가 틀리면 외부 사용자가 첫 단계에서 막힌다. README에 적힌
      # 명령을 실제로 실행하고, 툴 개수·테스트 수·버전을 대조한다.
      # (Chromium과 CLI 설치가 끝난 릴리스 게이트에서만 실행 가능)
      - name: README 설치 안내 검증
        run: uv run python scripts/check_readme.py
