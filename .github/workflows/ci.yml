name: CI

# 게이트 검증 파이프라인 (src/AGENTS.md §5 기준)
# - dev 대상 PR : 무결성 + 단위 테스트 (빠른 피드백)
# - main 대상 PR: 위 항목 + 릴리스 게이트 (전체 회귀는 단위 테스트 합산 결과를 재사용)
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: 문서·스크립트 무결성 (check_docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 계약 동결 검증에 동결 태그가 필요하므로 전체 히스토리를 가져온다.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 게이트 스크립트 자체의 문법 오류를 먼저 잡는다.
      # (AGENTS_REVIEW_02 P0-1: 인라인 one-liner가 SyntaxError로 깨진 사례 재발 방지)
      - name: 검증 스크립트 문법 검사 (py_compile)
        run: |
          python -m py_compile check_docs.py
          find scripts -name '*.py' -print0 2>/dev/null | xargs -0 -r python -m py_compile
          echo "OK: 모든 검증 스크립트 컴파일 통과"

      - name: 문서 무결성 검사 (제어문자 / 표 정합성)
        run: python check_docs.py

      # 문서에 적힌 게이트 명령어 자체가 실행 가능한지 검증한다.
      # (AGENTS_REVIEW_02 P0-1: Gate 1 인라인 명령어가 SyntaxError로 깨져
      #  게이트를 영구히 통과할 수 없던 사례 재발 방지)
      - name: 게이트 명령어 구문 검증
        run: python scripts/check_gate_commands.py

      # Gate 0 승인 이후 src/contracts/** 는 읽기 전용이다 (AGENTS.md §3-2).
      # 동결 태그 대비 변경이 있으면 실패시켜 무단 계약 수정을 차단한다.
      - name: 계약 동결 검증
        run: python scripts/check_contracts_freeze.py

      # 판정형 하네스가 커버리지 자기검증을 갖췄는지 확인한다.
      # (AGENTS.md §5 규칙 1 — 미측정 경로가 게이트를 통과하던 사고 재발 방지)
      - name: 하네스 커버리지 자기검증
        run: python scripts/check_harness_coverage.py

  # 단위 테스트는 파일 단위로 6 개 shard 에 나눠 돌린다(WS-96). shard 배정은 scripts/ci_shard.py 가
  # 저장소의 파일별 소요 시간표(scripts/ci_test_durations.json)로 LPT 균형을 잡고, 각 shard 안 순서는
  # 경로 정렬이다. 브랜치 보호의 필수 검사 이름 '단위 테스트 (pytest)' 는 아래 집계 job 이 갖는다.
  unit-test-shards:
    name: 단위 테스트 샤드 ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # 한 shard 실패가 나머지를 취소하지 않게 — 재실행은 실패한 shard 만(gh run rerun --failed).
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # WS-62 기준 동일성 시험이 git show 6e449e2/a081a91 을 씀 — 얕은 clone 이면 skip 됨

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: 의존성 동기화 (dev extras 포함)
        run: |
          uv sync --extra dev
          uv pip install -e .

      # 실브라우저 테스트가 CI에서 조용히 skip되면 Gate를 독립 검증할 수 없다.
      - name: Chromium 설치
        run: uv run playwright install --with-deps chromium

      # 창(headed) 테스트(WS-34 on-demand 창 전환·확인 코드 창 등)가 화면 없음으로
      # skip 되지 않게 가상 화면을 띄운다. 이후 모든 단계가 DISPLAY 를 물려받는다.
      - name: 가상 화면(Xvfb) 시작
        run: |
          sudo apt-get install -y -q xvfb
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # 빈 목록이면 ci_shard 가 exit 1 — pytest 에 빈 목록을 주면 testpaths 전체가 돈다.
      - name: shard 파일 목록
        run: |
          mkdir -p "$RUNNER_TEMP/shard"
          uv run python scripts/ci_shard.py --index ${{ matrix.shard }} --total 6 > "$RUNNER_TEMP/shard/files-${{ matrix.shard }}.txt"
          echo "파일 $(wc -l < "$RUNNER_TEMP/shard/files-${{ matrix.shard }}.txt")개"

      - name: pytest 실행
        shell: bash  # PIPESTATUS(pytest 종료 코드) 는 bash 전용
        run: |
          set +e
          out="$RUNNER_TEMP/shard"
          uv run pytest -q --durations=25 -o junit_family=xunit1 --junitxml="$out/junit-${{ matrix.shard }}.xml" "@$out/files-${{ matrix.shard }}.txt" 2>&1 | tee "$out/pytest-${{ matrix.shard }}.log"
          code=${PIPESTATUS[0]}
          exit $code

      # 재실행한 shard 의 옛 결과가 남지 않게 같은 이름을 덮어쓴다(집계는 shard 당 정확히 1개를 요구).
      - name: shard 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard/
          overwrite: true
          if-no-files-found: error

  # 필수 검사 이름을 갖는 집계 job. needs 만 두면 shard 실패 시 이 job 이 skip 되고, skip 된 필수 검사는
  # 'Success' 로 간주되어 실패한 채 머지된다 → !cancelled() 로 항상 돌고 첫 단계에서 shard 결과를 명시 검사.
  unit-tests:
    name: 단위 테스트 (pytest)
    needs: [unit-test-shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 모든 shard 성공 확인
        run: |
          result="${{ needs.unit-test-shards.result }}"
          echo "shard 결과: $result"
          if [ "$result" != "success" ]; then
            echo "::error::단위 테스트 shard 가 성공하지 않았습니다 ($result)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # shard 와 같은 checkout 으로 수집한다

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: 의존성 동기화 (dev extras 포함)
        run: |
          uv sync --extra dev
          uv pip install -e .

      - name: shard 결과 내려받기
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-shard-*
          path: ${{ runner.temp }}/shards

      - name: shard 결과 개수 확인 (shard 당 정확히 1개)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/shards"
          ls -1
          n=$(ls -1d pytest-shard-* | wc -l)
          if [ "$n" -ne 6 ]; then echo "::error::shard 결과 $n 개 (6 이어야 함)"; exit 1; fi
          for i in 1 2 3 4 5 6; do
            for f in "files-$i.txt" "junit-$i.xml" "pytest-$i.log"; do
              if [ ! -f "pytest-shard-$i/$f" ]; then echo "::error::pytest-shard-$i/$f 없음"; exit 1; fi
            done
          done

      # 누락·중복 방지: 목록 서로소·합집합 == tests 의 test_*.py·각 목록 경로 정렬,
      # 전체 collect-only 의 파일별 노드 수 == shard junit 의 파일별 노드 수.
      - name: shard 목록·노드 수 대조
        shell: bash
        run: |
          set -o pipefail
          S="$RUNNER_TEMP/shards"
          uv run pytest --collect-only -q tests > "$RUNNER_TEMP/collect.txt"
          tail -n 1 "$RUNNER_TEMP/collect.txt"
          uv run python scripts/ci_shard.py --check --total 6 \
            --lists "$S"/pytest-shard-{1..6}/files-*.txt \
            --collect "$RUNNER_TEMP/collect.txt" \
            --junit "$S"/pytest-shard-{1..6}/junit-*.xml

      # 각 shard 의 pytest 마지막 요약 줄을 합산해 pytest-full.log **마지막 줄**로 쓴다(0 인 범주 생략).
      # 릴리스 게이트의 check_readme 가 이 파일의 마지막 요약 줄에서 통과 수를 읽는다.
      - name: 결과 합산·느린 시험 요약
        shell: bash
        run: |
          set +e  # 합산 실패여도 로그·summary 는 남기고 마지막에 그 종료 코드로 끝낸다
          S="$RUNNER_TEMP/shards"
          full="$RUNNER_TEMP/pytest-full/pytest-full.log"
          mkdir -p "$RUNNER_TEMP/pytest-full"
          cat "$S"/pytest-shard-{1..6}/pytest-*.log > "$full"
          line=$(uv run python scripts/ci_shard.py --summarize "$S"/pytest-shard-{1..6}/pytest-*.log --out "$full")
          code=$?
          echo "$line"
          uv run python scripts/ci_shard.py --report --junit "$S"/pytest-shard-{1..6}/junit-*.xml \
            --out "$RUNNER_TEMP/report.md"
          uv run python scripts/ci_shard.py --update-durations "$S"/pytest-shard-{1..6}/junit-*.xml \
            --out "$RUNNER_TEMP/pytest-full/ci_test_durations.json"
          {
            echo "## 단위 테스트 (pytest) — 6 shard 합산"
            echo ""
            echo '```'
            echo "$line"
            echo '```'
            echo ""
            cat "$RUNNER_TEMP/report.md"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: 합산 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-log
          path: ${{ runner.temp }}/pytest-full/
          overwrite: true

  release-gate:
    name: 릴리스 게이트 (main 대상 PR 전용)
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [integrity, unit-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 기준 동일성 시험(git show <커밋>:) — 얕은 clone 이면 13개 skip 되어 check_readme 불일치(v1.17.0)

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: 의존성 동기화
        run: |
          uv sync --extra dev
          uv pip install -e .

      - name: Chromium 설치
        run: uv run playwright install --with-deps chromium

      # 창(headed) 테스트를 실제로 돌리고, check_readme 의 통과 수가 화면 있는
      # 로컬 게이트와 같게 한다(v1.11.0: Xvfb 없이 13개 skip → 2007 vs 2020 불일치).
      - name: 가상 화면(Xvfb) 시작
        run: |
          sudo apt-get install -y -q xvfb
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # Stage 진행에 따라 아래 게이트를 순차적으로 활성화한다.
      # (src/AGENTS.md §5의 Gate 0 ~ Gate 3-B 명령어와 1:1 대응)
      - name: Gate 0 — 계약 동결 검증
        run: |
          if [ -d src/contracts ]; then
            uv run python -c "import contracts; assert len([m for m in dir(contracts) if m.endswith('Input')]) == 19"
            uv run python -c "from contracts import ErrorCode; assert len(ErrorCode) >= 20"
            uv run pytest tests/contracts -q
          else
            echo "::notice::src/contracts 미존재 — Stage 0 착수 전이므로 건너뜁니다."
          fi

      - name: Gate 1 — 하네스 자체 검증
        run: |
          if [ -d src/harness ]; then
            uv run python -m harness.contract_selftest
            uv run python -m harness.selfcheck
            uv run python -m harness.recall --golden
          else
            echo "::notice::src/harness 미존재 — Stage 1 착수 전이므로 건너뜁니다."
          fi

      - name: Gate 2 — 인지 엔진 실측
        run: |
          if [ -d src/perception ]; then
            uv run python -m harness.recall --pages 100 --top-n 20
          else
            echo "::notice::src/perception 미존재 — Stage 2 착수 전이므로 건너뜁니다."
          fi

      - name: Gate 3-B — MVP v1.0 릴리스 게이트
        run: |
          if [ -d src/interface ]; then
            uv run python -m harness.mcp_smoke
          uv run python -m harness.mcp_binding
            uv run python -m harness.flaky_test --runs 5
            uv run python -m harness.latency_test --steps 100
            uv run python -m harness.webarena --tasks 20
            uv run python -m harness.ipi_test
            uv run python -m harness.session_probe --runs 50
            uv run python -m harness.recipe_replay
          else
            echo "::notice::src/interface 미존재 — Stage 3-B 착수 전이므로 건너뜁니다."
          fi

      # 전체 pytest 는 다시 돌리지 않는다 — 같은 run 의 집계 job(단위 테스트 (pytest))이 6 shard 를
      # 합산해 남긴 pytest-full.log 를 받아 README 검사의 통과 수로 쓴다(WS-96).
      - name: 단위 테스트 합산 로그 내려받기
        uses: actions/download-artifact@v4
        with:
          name: pytest-full-log
          path: ${{ runner.temp }}/pytest-full

      # 설치 안내가 실제와 일치하는지 검증한다.
      # 문서가 틀리면 외부 사용자가 첫 단계에서 막힌다. README에 적힌
      # 명령을 실제로 실행하고, 툴 개수·테스트 수·버전을 대조한다.
      # (Chromium과 CLI 설치가 끝난 릴리스 게이트에서만 실행 가능)
      - name: README 설치 안내 검증
        env:
          AGENT_BROWSER_PYTEST_LOG: ${{ runner.temp }}/pytest-full/pytest-full.log
        run: uv run python scripts/check_readme.py
