[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-browser"
version = "1.1.1"
description = "Agent-Native Headless Browsing Engine & MCP Server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "playwright>=1.48.0",
    "pydantic>=2.10.0",
    "textual>=0.80.0",
    "rich>=13.9.0",
    "cryptography>=44.0.0",
    "keyring>=25.5.0",
    "mcp>=1.1.0",
    "tiktoken>=0.8.0",
    "httpx>=0.27.0",
]

[project.scripts]
# CLI 진입점. 이것이 없으면 `pip install` 후에도 명령이 만들어지지 않는다.
agent-browser = "interface.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
# src/ 아래 모든 패키지를 포함해야 한다. 여기서 누락되면 설치는 성공하는데
# import만 실패해 원인을 찾기 어렵다 — agent/ llm/ 이 실제로 빠져 있었다.
packages = [
    "src/contracts",
    "src/browser",
    "src/perception",
    "src/actions",
    "src/security",
    "src/interface",
    "src/harness",
    "src/agent",
    "src/llm",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
